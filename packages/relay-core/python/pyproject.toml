[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r2-relay-core"
version = "0.1.0"
description = "Host-agnostic Python shared transport core for the R2 relay"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["r2_relay_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
