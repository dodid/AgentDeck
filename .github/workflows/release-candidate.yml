name: Release candidate validation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform integration to validate beside the iOS live object-store smoke test
        required: true
        default: all
        type: choice
        options: [all, openclaw, hermes]

permissions:
  contents: read

concurrency:
  group: release-candidate-validation
  cancel-in-progress: false

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["openclaw","hermes"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Start disposable native MinIO
        run: |
          brew install minio minio-mc
          minio server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          mc mb "local/agentdeck-${{ matrix.platform }}-${{ github.run_id }}"

      - uses: actions/setup-node@v7
        if: matrix.platform == 'openclaw'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json
      - name: Validate current OpenClaw integration
        if: matrix.platform == 'openclaw'
        working-directory: integrations/openclaw
        env:
          R2_RELAY_E2E_MODE: transport
          R2_RELAY_E2E_ENDPOINT: http://127.0.0.1:9000
          R2_RELAY_E2E_BUCKET: agentdeck-${{ matrix.platform }}-${{ github.run_id }}
          R2_RELAY_E2E_ACCESS_KEY_ID: minioadmin
          R2_RELAY_E2E_SECRET_ACCESS_KEY: minioadmin
          R2_RELAY_E2E_SERVER_ID: release-openclaw
          R2_RELAY_E2E_CLIENT_PEER: agentdeck-ci
          R2_RELAY_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/openclaw-e2e
        run: |
          npm ci
          npm install --no-save openclaw@latest
          npm test
          npm run e2e:transport

      - name: Check out current Hermes
        if: matrix.platform == 'hermes'
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          path: vendor/hermes-agent
      - uses: actions/setup-python@v7
        if: matrix.platform == 'hermes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/hermes/pyproject.toml
      - name: Validate current Hermes integration
        if: matrix.platform == 'hermes'
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/hermes-agent
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          AGENTDECK_TEST_R2_ENDPOINT: http://127.0.0.1:9000
          AGENTDECK_TEST_R2_BUCKET: agentdeck-${{ matrix.platform }}-${{ github.run_id }}
          AGENTDECK_TEST_R2_ACCESS_KEY_ID: minioadmin
          AGENTDECK_TEST_R2_SECRET_ACCESS_KEY: minioadmin
          AGENTDECK_TEST_CLIENT_PEER: agentdeck-ci
        working-directory: integrations/hermes
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Validate packaged Hermes lifecycle
        if: matrix.platform == 'hermes'
        env:
          AGENTDECK_LIFECYCLE_ARTIFACTS: ${{ runner.temp }}/hermes-lifecycle
        run: tools/maintenance/hermes-plugin-lifecycle.sh vendor/hermes-agent

      - name: Select current Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Resolve iOS packages
        working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -project AgentDeck.xcodeproj -scheme AgentDeck
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$DEVICE_ID" -a "$DEVICE_ID" != "null"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Run unsigned iOS tests against disposable MinIO
        working-directory: apps/ios
        env:
          AGENTDECK_TEST_R2_ENDPOINT: http://127.0.0.1:9000
          AGENTDECK_TEST_R2_BUCKET: agentdeck-${{ matrix.platform }}-${{ github.run_id }}
          AGENTDECK_TEST_R2_ACCESS_KEY_ID: minioadmin
          AGENTDECK_TEST_R2_SECRET_ACCESS_KEY: minioadmin
          AGENTDECK_TEST_PLATFORM: ${{ matrix.platform }}
          AGENTDECK_TEST_SERVER_ID: ${{ matrix.platform == 'openclaw' && 'release-openclaw' || 'hermes-live' }}
          AGENTDECK_TEST_CLIENT_PEER: agentdeck-ci
        run: |
          set -o pipefail
          xcodebuild test \
            -project AgentDeck.xcodeproj \
            -scheme AgentDeck \
            -skipPackagePluginValidation \
            -derivedDataPath '${{ runner.temp }}/AgentDeckDerivedData-${{ matrix.platform }}' \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -parallel-testing-enabled NO \
            -resultBundlePath 'ReleaseCandidate-${{ matrix.platform }}.xcresult' \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify iOS fresh install and upgrade persistence
        run: |
          tools/maintenance/ios-simulator-lifecycle.sh \
            '${{ steps.simulator.outputs.id }}' \
            '${{ runner.temp }}/AgentDeckDerivedData-${{ matrix.platform }}/Build/Products/Debug-iphonesimulator/AgentDeck.app'
      - name: Upload release-candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ matrix.platform }}
          path: |
            apps/ios/ReleaseCandidate-${{ matrix.platform }}.xcresult
            ${{ runner.temp }}/minio.log
            ${{ runner.temp }}/openclaw-e2e
            ${{ runner.temp }}/hermes-lifecycle
          if-no-files-found: ignore
