name: Release candidate validation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform integration to validate beside the iOS live object-store smoke test
        required: true
        default: all
        type: choice
        options: [all, openclaw, hermes]

permissions:
  contents: read

concurrency:
  group: release-candidate-validation
  cancel-in-progress: false

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["openclaw","hermes"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Start disposable native MinIO
        run: |
          brew install minio minio-mc
          minio server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          mc mb "local/clawchat-${{ matrix.platform }}-${{ github.run_id }}"

      - uses: actions/setup-node@v7
        if: matrix.platform == 'openclaw'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json
      - name: Validate current OpenClaw integration
        if: matrix.platform == 'openclaw'
        working-directory: integrations/openclaw
        run: |
          npm ci
          npm install --no-save openclaw@latest
          npm test

      - name: Check out current Hermes
        if: matrix.platform == 'hermes'
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          path: vendor/hermes-agent
      - uses: actions/setup-python@v7
        if: matrix.platform == 'hermes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/hermes/pyproject.toml
      - name: Validate current Hermes integration
        if: matrix.platform == 'hermes'
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/hermes-agent
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        working-directory: integrations/hermes
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q

      - name: Select current Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Resolve iOS packages
        working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -project ClawChat.xcodeproj -scheme ClawChat
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$DEVICE_ID" -a "$DEVICE_ID" != "null"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Run unsigned iOS tests against disposable MinIO
        working-directory: apps/ios
        env:
          CLAWCHAT_TEST_R2_ENDPOINT: http://127.0.0.1:9000
          CLAWCHAT_TEST_R2_BUCKET: clawchat-${{ matrix.platform }}-${{ github.run_id }}
          CLAWCHAT_TEST_R2_ACCESS_KEY_ID: minioadmin
          CLAWCHAT_TEST_R2_SECRET_ACCESS_KEY: minioadmin
        run: |
          set -o pipefail
          xcodebuild test \
            -project ClawChat.xcodeproj \
            -scheme ClawChat \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath 'ReleaseCandidate-${{ matrix.platform }}.xcresult' \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload release-candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ matrix.platform }}
          path: |
            apps/ios/ReleaseCandidate-${{ matrix.platform }}.xcresult
            ${{ runner.temp }}/minio.log
          if-no-files-found: ignore
