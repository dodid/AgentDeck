name: Upstream canary

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  openclaw_latest:
    name: OpenClaw latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json
      - run: npm ci
      - name: Replace the pinned development dependency with latest OpenClaw
        run: npm install --no-save openclaw@latest
      - run: npm test
      - id: version
        name: Record tested OpenClaw version
        run: |
          version=$(node -p "require('./node_modules/openclaw/package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Exercise packaged lifecycle on latest OpenClaw
        env:
          AGENTDECK_LIFECYCLE_ARTIFACTS: ${{ runner.temp }}/openclaw-lifecycle
        run: npm run test:lifecycle
      - name: Start disposable MinIO
        run: |
          docker run --detach --rm --name agentdeck-openclaw-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run deterministic latest-OpenClaw relay E2E
        env:
          R2_RELAY_E2E_MODE: transport
          R2_RELAY_E2E_ENDPOINT: http://127.0.0.1:9000
          R2_RELAY_E2E_BUCKET: openclaw-canary-${{ github.run_id }}
          R2_RELAY_E2E_ACCESS_KEY_ID: minioadmin
          R2_RELAY_E2E_SECRET_ACCESS_KEY: minioadmin
          R2_RELAY_E2E_SERVER_ID: canary-openclaw
          R2_RELAY_E2E_CLIENT_PEER: canary-agentdeck
          R2_RELAY_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/openclaw-e2e
        run: npm run e2e:transport
      - name: Upload OpenClaw canary diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-latest-lifecycle
          path: |
            ${{ runner.temp }}/openclaw-lifecycle
            ${{ runner.temp }}/openclaw-e2e
          if-no-files-found: ignore

  hermes_main:
    name: Hermes main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.commit.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out current Hermes
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          path: vendor/hermes-agent
      - id: commit
        name: Record tested Hermes commit
        run: echo "value=$(git -C vendor/hermes-agent rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/hermes/pyproject.toml
      - run: python -m pip install -e './integrations/hermes[dev]'
      - name: Start disposable MinIO
        run: |
          docker run --detach --rm --name agentdeck-hermes-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Test against current Hermes source
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/hermes-agent
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          AGENTDECK_TEST_R2_ENDPOINT: http://127.0.0.1:9000
          AGENTDECK_TEST_R2_BUCKET: hermes-canary-${{ github.run_id }}
          AGENTDECK_TEST_R2_ACCESS_KEY_ID: minioadmin
          AGENTDECK_TEST_R2_SECRET_ACCESS_KEY: minioadmin
          AGENTDECK_TEST_CLIENT_PEER: canary-agentdeck
        working-directory: integrations/hermes
        run: python -m pytest -q
      - name: Exercise packaged lifecycle on current Hermes
        env:
          AGENTDECK_LIFECYCLE_ARTIFACTS: ${{ runner.temp }}/hermes-lifecycle
        run: tools/maintenance/hermes-plugin-lifecycle.sh vendor/hermes-agent
      - name: Upload Hermes canary diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermes-main-lifecycle
          path: ${{ runner.temp }}/hermes-lifecycle
          if-no-files-found: ignore

  propose_compatibility_update:
    name: Propose tested compatibility update
    if: github.event_name == 'schedule'
    needs: [openclaw_latest, hermes_main]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json
      - name: Update tested platform revisions
        run: |
          node tools/maintenance/update-compatibility.mjs \
            '${{ needs.openclaw_latest.outputs.version }}' \
            '${{ needs.hermes_main.outputs.commit }}'
          npm install --package-lock-only --ignore-scripts --prefix integrations/openclaw
          node tools/ci/check-compatibility-manifest.mjs
      - name: Open or update compatibility pull request
        run: |
          if git diff --quiet; then
            echo "Compatibility manifest is already current."
            exit 0
          fi
          branch=automation/platform-compatibility
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git add compatibility.json integrations/openclaw/package.json integrations/openclaw/package-lock.json
          git commit -m "chore: update tested platform compatibility"
          git push --force-with-lease origin "$branch"
          body="Automated proposal after the latest OpenClaw and Hermes install, upgrade, and integration canaries passed."
          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --body "$body"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update tested platform compatibility" \
              --body "$body"
          fi

  report_failure:
    name: Report canary failure
    if: always() && (needs.openclaw_latest.result == 'failure' || needs.hermes_main.result == 'failure')
    needs: [openclaw_latest, hermes_main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update the canary failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Upstream compatibility canary is failing";
            const body = [
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `OpenClaw latest: ${{ needs.openclaw_latest.result }}`,
              `Hermes main: ${{ needs.hermes_main.result }}`,
              "",
              "No production credentials or personal infrastructure were used by this run."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
