name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS build and XCTest
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      - name: Select current Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ClawChat.xcodeproj -scheme ClawChat
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$DEVICE_ID" -a "$DEVICE_ID" != "null"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Build and test without signing
        run: |
          set -o pipefail
          xcodebuild test \
            -project ClawChat.xcodeproj \
            -scheme ClawChat \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: apps/ios/TestResults.xcresult
          if-no-files-found: ignore
